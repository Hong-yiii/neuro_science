[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-science-workspace"
version = "0.1.0"
description = "Reproducible loaders and analyses for the neuroscience workspace"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.12",
  "matplotlib>=3.9",
  "numpy>=1.26.4",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "threadpoolctl>=3.1",
  "joblib>=1.3",
]

[project.optional-dependencies]
cebra = ["cebra==0.6.1", "torch>=2.0"]
notebooks = [
  "nbformat>=5.10",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neuro", "neuro.*"]

[tool.setuptools.package-data]
neuro = ["README.md"]

[dependency-groups]
cebra-pilot = ["cebra==0.6.1"]
dev = []

[tool.pyright]
extraPaths = ["src"]
